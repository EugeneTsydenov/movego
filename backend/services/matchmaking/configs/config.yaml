app:
  name: "movego-matchmaking"
  shutdown_timeout: "15s"
  log_level: "warn"

redis:
  addr: "redis:6379"
  username: redis
  db: 0
  pool_size: 50
  min_idle_conns: 10
  conn_max_idle_time: "5m"
  dial_timeout: "5s"
  read_timeout: "3s"
  write_timeout: "3s"
  max_retries: 3


server:
  host: "0.0.0.0"
  port: 8070
  read_timeout: "5s"
  write_timeout: "10s"
  idle_timeout: "120s"
  shutdown_timeout: "15s"

game_client:
  host: "game-service"
  port: 8090
  dial_timeout: "5s"
  read_timeout: "3s"
  max_retries: 3
  tls_enabled: false

otel:
  endpoint: "tempo:4317"
  metrics_port: 2102
