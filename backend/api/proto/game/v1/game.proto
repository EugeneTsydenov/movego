syntax = "proto3";

package game.v1;

option go_package = "gen/game/v1;gamev1";

import "buf/validate/validate.proto";

service GameService {
    rpc CreateGame(CreateGameRequest) returns (CreateGameResponse);
    rpc MakeMove(stream MakeMoveRequest) returns (stream MakeMoveResponse);
}

message Player {
    string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
    string name = 2 [(buf.validate.field).required = true];
    int32 rating = 3 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 0];
}

message CreateGameRequest {
    Player white_player = 1;
    Player black_player = 2;
    string time_control_id = 3 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.pattern = "^\\d+\\+\\d+$"
    ];
}

message CreateGameResponse {
    string game_id = 1;
}

message MakeMoveRequest {
    string game_id = 1 [(buf.validate.field).string.uuid = true];
    string move = 2;
}

message MakeMoveResponse {

}
