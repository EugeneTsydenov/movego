syntax = "proto3";
package movego.v1;

option go_package = "movego/gen/go/movego/v1;movegov1";

import "google/protobuf/timestamp.proto";

message User {
  string id = 1;
  string email = 2;
  string tag = 3;
  string display_name = 4;
  string role = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}
