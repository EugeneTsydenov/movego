version: '3.8'

services:
  user-service:
    build:
      context: .
      dockerfile: ./services/user-service/Dockerfile
    ports:
      - "8080:8080"
      - "2112:2112"
      - "8081:8081"
    environment:
      - USER_SERVICE_ENV=dev
      - USER_SERVICE_DATABASE_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  game-service:
    build:
      context: .
      dockerfile: ./services/game-service/Dockerfile
    ports:
      - "8082:8080"
      - "2113:2112"
    environment:
      - GAME_SERVICE_ENV=dev
      - GAME_SERVICE_DATABASE_PASSWORD=postgres
      - GAME_SERVICE_REDIS_PASSWORD=redis
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: movego_db_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: movego_user
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./deployments/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      app-network:
        aliases:
          - postgres

  redis:
    image: redis:7-alpine
    container_name: movego_redis_dev
    command: [
      "redis-server",
      "--user", "default", "off",
      "--user", "redis", "on", ">redis", "~*", "&*", "+@all"
    ]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: monitoring_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - tempo
    networks:
      - app-network
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: monitoring_tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "3200:3200"
    networks:
      - app-network
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: monitoring_loki
    command: [ "-config.file=/etc/loki.yaml" ]
    volumes:
      - ./observability/loki.yaml:/etc/loki.yaml
    ports:
      - "3100:3100"
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - app-network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: monitoring_promtail
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - app-network

volumes:
  pgdata_dev:

networks:
  app-network:
    name: app-network
