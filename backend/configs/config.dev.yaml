app:
  name: "movego-backend"
  shutdown_timeout: "15s"
  log_level: "debug"

database:
  host: "postgres"
  port: 5432
  name: "movego_dev"
  user: "postgres"
  driver: "postgres"
  ssl_mode: "disable"
  max_conn: 5

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "60s"
  shutdown_timeout: "2s"

jwt:
  access_ttl: "15m"
  refresh_ttl: "720h"
  issuer: "movego"

otel:
  endpoint: "tempo:4317"
  metrics_port: 2112
